# Lightweight kube-prometheus-stack config for t3.micro nodes (demo only).
# Disables Alertmanager and sets tight resource limits so it fits in 1GB RAM.

grafana:
  adminPassword: admin
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "256Mi"
      cpu: "200m"

prometheus:
  prometheusSpec:
    resources:
      requests:
        memory: "256Mi"
        cpu: "100m"
      limits:
        memory: "400Mi"
        cpu: "300m"
    retention: 6h
    additionalScrapeConfigs:
      - job_name: omnistream-app
        scrape_interval: 15s
        static_configs:
          - targets:
              - omnistream-service.default.svc.cluster.local:80
        metrics_path: /metrics

# Disable Alertmanager to save memory on t3.micro
alertmanager:
  enabled: false

# Disable heavy node exporters to save resources
nodeExporter:
  enabled: false

kubeStateMetrics:
  enabled: false
  resources:
    requests:
      memory: "32Mi"
      cpu: "50m"
    limits:
      memory: "64Mi"
      cpu: "100m"
